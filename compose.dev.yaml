# API and Vite run on the host; only this database is exposed to localhost.
name: listva-dev
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listva}
      POSTGRES_DB: ${POSTGRES_DB:-listva}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ['127.0.0.1:${DB_PORT:-15432}:5432']
    volumes: [postgres-dev-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-dev-data:
