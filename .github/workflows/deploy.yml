name: Build and deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api: ${{ steps.resolved.outputs.api }}
      web: ${{ steps.resolved.outputs.web }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: images
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}-api:$COMMIT" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}-web:$COMMIT" >> "$GITHUB_OUTPUT"
      - id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - id: resolved
        name: Resolve immutable deployment images
        env:
          API_TAG: ${{ steps.images.outputs.api }}
          WEB_TAG: ${{ steps.images.outputs.web }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
        run: |
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "api=${API_TAG%:*}@$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_TAG%:*}@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/listva' }}
          DEPLOY_PUBLIC_HOST: ${{ vars.PUBLIC_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
          API_IMAGE: ${{ needs.publish.outputs.api }}
          WEB_IMAGE: ${{ needs.publish.outputs.web }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: bash scripts/deploy-ssh.sh
