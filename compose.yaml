name: listva

x-api: &api
  image: ${API_IMAGE:-listva-api:local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-listva}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-listva}?schema=public&connection_limit=10&pool_timeout=3&connect_timeout=3
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TRUST_PROXY: 'true'
    NODE_ENV: production
  networks: [internal]

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-listva}
      POSTGRES_DB: ${POSTGRES_DB:-listva}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [internal]
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command:
      [
        node,
        node_modules/prisma/build/index.js,
        migrate,
        deploy,
        --schema,
        apps/api/prisma/schema.prisma,
      ]
    restart: 'no'
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *api
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-listva-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports: ['${HTTP_PORT:-8080}:80']
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      api: { condition: service_healthy }

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.128.0
    command:
      [
        -storageDataPath=/storage,
        -retentionPeriod=30d,
        -promscrape.config=/etc/victoriametrics/scrape.yml,
        -memory.allowedPercent=60,
      ]
    restart: unless-stopped
    volumes:
      - victoria-data:/storage
      - ./infra/monitoring/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    ports: ['0.0.0.0:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/listva.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    depends_on: [victoriametrics]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      [
        --path.rootfs=/host,
        '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)',
      ]
    pid: host
    volumes: ['/:/host:ro']
    networks: [internal]
    mem_limit: 96m
    cpus: 0.25

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg:/dev/kmsg]
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [internal]
    mem_limit: 256m
    cpus: 0.5

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/config.yml]
    volumes: ['./infra/monitoring/blackbox.yml:/etc/blackbox/config.yml:ro']
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  victoria-data:
  grafana-data:
